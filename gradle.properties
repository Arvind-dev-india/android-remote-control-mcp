# Project-wide Gradle settings.

# JVM memory allocation
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Build performance: reuse task outputs across builds/CI runs (the build cache is persisted
# across CI runs by gradle/actions/setup-gradle) and run independent tasks/projects in parallel.
# The configuration cache is intentionally NOT enabled: configuration reads git via ProcessBuilder
# and uses androidComponents/taskGraph.whenReady, which the configuration cache rejects.
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Application versioning.
# Yedhant builds use the planned fork release name without requiring a local tag.
# Release CI can still override it with -PVERSION_NAME from the published tag.
# Other version names fall back to git describe. There is intentionally NO
# VERSION_CODE here: the version code is always derived from git history in
# app/build.gradle.kts (getGitVersionCode), never hardcoded.
VERSION_NAME=1.12.0-yedhant.2
