name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout hardened source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin homelab --force
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/homelab)"
          run_id=$(gh api --method GET \
            "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=completed&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" and .head_branch == "homelab")][0].id // empty')
          test -n "$run_id"

      - name: Parse version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc[0-9]+|yedhant\.[0-9]+))?$ ]]; then
            echo "::error::Expected vMAJOR.MINOR.PATCH[-alpha|-beta|-rcN|-yedhant.N]"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          suffix="${BASH_REMATCH[5]}"
          prerelease=false
          offset=99
          case "$suffix" in
            "") ;;
            alpha) prerelease=true; offset=1 ;;
            beta) prerelease=true; offset=10 ;;
            rc*)
              prerelease=true
              rc="${suffix#rc}"
              test "$rc" -ge 1
              offset=$((20 + 10#$rc))
              test "$offset" -lt 99
              ;;
            yedhant.*)
              build="${suffix#yedhant.}"
              test "$build" -ge 1
              offset=$((50 + 10#$build))
              test "$offset" -lt 99
              ;;
          esac
          version_code=$((10#$major * 1000000 + 10#$minor * 10000 + 10#$patch * 100 + offset))
          test "$version_code" -le 2147483647
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Cache cloudflared Android native
        id: cache-cloudflared
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libcloudflared.so
            app/src/main/jniLibs/x86_64/libcloudflared.so
          key: cloudflared-android-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/cloudflared/**/*.go', 'vendor/cloudflared/go.sum') }}

      - name: Cache ngrok-java Android native
        id: cache-ngrok-android
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            app/src/main/jniLibs/arm64-v8a/libngrok_java.so
            app/src/main/jniLibs/x86_64/libngrok_java.so
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.2.0-SNAPSHOT.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-android-v2-${{ runner.os }}-${{ hashFiles('.gitmodules', 'vendor/ngrok-java/**/*.toml', 'vendor/ngrok-java/**/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/**') }}

      - name: Set up Go
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.6"

      - name: Set up Rust
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Compile cloudflared
        if: steps.cache-cloudflared.outputs.cache-hit != 'true'
        run: make compile-cloudflared

      - name: Compile ngrok-java native library
        if: steps.cache-ngrok-android.outputs.cache-hit != 'true'
        run: make compile-ngrok-native
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compute DB-IP month
        id: dbip-month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache DB-IP source CSV
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .dbip-cache
          key: dbip-csv-${{ steps.dbip-month.outputs.month }}

      - name: Build unsigned release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          test ! -e keystore.properties
          ./gradlew ktlintCheck detekt assembleGmsRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"
          test -f app/build/outputs/apk/gms/release/app-gms-release-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: app/build/outputs/apk/gms/release/app-gms-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-release
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Revalidate branch and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch_sha=$(gh api "repos/${REPO}/git/ref/heads/homelab" --jq .object.sha)
          tag_sha=$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)
          test "$GITHUB_SHA" = "$branch_sha"
          test "$GITHUB_SHA" = "$tag_sha"

      - name: Download unsigned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: unsigned

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: 64cad71c-8b39-4cda-b5eb-492a373b3c3c
          tenant-id: fa8b52e9-446f-4a5b-bdbf-1fa499573895
          subscription-id: 26ddb88c-15c4-4f21-9a81-9a4ac5368487

      - name: Sign and verify release APK
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_CERT_SHA256: D076D7BA53A92EE6EE4358CFF1E48D7E4659365A13239A844F61A1D068B85B00
        run: |
          set -euo pipefail
          umask 077
          cleanup() {
            unset SIGNING_PASSWORD
            shred -u release-keystore.p12 2>/dev/null || rm -f release-keystore.p12
          }
          trap cleanup EXIT
          az keyvault secret show \
            --vault-name homelab-kv-mmavwn \
            --name android-phone-mcp-signing-keystore-base64 \
            --query value -o tsv | base64 --decode > release-keystore.p12
          export SIGNING_PASSWORD
          SIGNING_PASSWORD=$(az keyvault secret show \
            --vault-name homelab-kv-mmavwn \
            --name android-phone-mcp-signing-password \
            --query value -o tsv)
          key_alias=$(az keyvault secret show \
            --vault-name homelab-kv-mmavwn \
            --name android-phone-mcp-signing-alias \
            --query value -o tsv)
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$apksigner"
          test -n "$aapt"
          mkdir -p release-assets
          asset="release-assets/yedhant-android-mcp-${TAG}.apk"
          "$apksigner" sign \
            --ks release-keystore.p12 \
            --ks-key-alias "$key_alias" \
            --ks-pass env:SIGNING_PASSWORD \
            --key-pass env:SIGNING_PASSWORD \
            --out "$asset" \
            unsigned/app-gms-release-unsigned.apk
          unset key_alias
          "$apksigner" verify --verbose --print-certs "$asset" > certificate.txt 2>&1
          cat certificate.txt
          actual_cert=$(awk '/certificate SHA-256 digest:/{print $NF; exit}' certificate.txt \
            | tr '[:lower:]' '[:upper:]' | tr -cd '0-9A-F')
          echo "Signer certificate SHA-256: $actual_cert"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          "$aapt" dump badging "$asset" | grep -F "package: name='com.yedhant.androidremotecontrolmcp'"
          "$aapt" dump badging "$asset" | grep -F "versionName='${VERSION}'"
          rm -f certificate.txt
          (cd release-assets && sha256sum "$(basename "$asset")" > "$(basename "$asset").sha256")
          cleanup
          trap - EXIT

      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" "${flags[@]}" release-assets/*
